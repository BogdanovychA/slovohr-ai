name: slovohr-ai.bogdanovych.org

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: flet_slovohr-ai:${APP_VERSION}
    pull_policy: missing
    restart: unless-stopped
    env_file:
      - src/assets/.env
    volumes:
      - ./src/assets/database:/app/src/assets/database
      - ./src/assets/images/persons:/app/src/assets/images/persons
    ports:
      - "8009:8000"

  cloudflared:
#    image: cloudflare/cloudflared:latest
    image: cloudflare/cloudflared:2026.10.3
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE__TUNNEL_TOKEN}
    depends_on:
      - web
